[package]
name = "apocalypse"
version = "0.6.17"
license = "MIT"
description = "Simple actor framework for Rust"
repository = "https://github.com/Malanche/apocalypse.git"
authors = ["Carlos Malanche <carlos.malanche.f@gmail.com>"]
edition = "2021"
keywords = ["actor"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
all-features = true

[features]
full_log = []
ws = ["cataclysm", "bytes"]
serde = ["dep:serde", "chrono/serde"]

[dependencies]
log = {version = "0.4.29", features = ["std"]}
tokio = {version = "1.50.0", features = ["full"]}
chrono = "0.4.44"
futures = "0.3.32"
serde = {version = "1.0.228", features = ["derive"], optional = true}
bytes = {version = "1.11.1", optional = true}
cataclysm = {path = "../cataclysm/cataclysm", version = "0.5.7", features=["stream", "ws"], optional = true}

[dev-dependencies]
criterion = {version = "0.8.2", features = ["async_tokio"]}
colored = "3.1.1"
winapi = "0.3.9"
chrono = "0.4.44"

[[bench]]
name = "per_second"
harness = false